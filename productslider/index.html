<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Product slider</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="container">
        <div class="slider flex row space-around">
            <div class="left-control" id="previousSlide">
                <img src="assets/btn_prev.png" alt="btn-prev">
            </div>
            <div id="products" class="products flex row">
                
            </div>
            <div class="right-control" id="nextSlide">
                <img src="assets/btn_next.png" alt="btn-next">
            </div>
        </div>
    </div>
    <script src="script.js"></script>
</body>
</html>
