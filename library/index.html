<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Library</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <header>
        <h1 class="logo">Library</h1>
    </header>
    <div class="main-content">
        <div class="addNewBook flex">
            <h2>Add a new book</h2>
            <div class="addbookForm flex column">
                <label for="title">Title</label>
                <input type="text" name="title">
                <label for="author">Author</label>
                <input type="text" name="author">
                <label for="pages">Pages amount</label>
                <input type="number" name="pages">
                <label for="read">Already read the book</label>
                <input type="checkbox" name="read">
                <button id="addBookButton">Add+</button>
            </div>
        </div>
        <div class="myLibrary">
            <h2>My library</h2>
            <div class="books flex row space-between">

            </div>
        </div>
    </div>
    <script src="script.js"></script>
</body>
</html>
